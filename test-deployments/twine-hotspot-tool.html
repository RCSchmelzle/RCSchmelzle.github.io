<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Twine Hotspot Tool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f4f0;color:#1a1a18;padding:1rem;max-width:1200px;margin:0 auto}
h1{font-size:18px;font-weight:500;margin-bottom:1rem;color:#1a1a18}

/* layout */
.top-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;padding:10px 14px;background:#fff;border:0.5px solid rgba(0,0,0,0.12);border-radius:10px}
.top-bar input[type="text"]{flex:1;min-width:200px;font-family:monospace;font-size:13px;padding:6px 8px;border:0.5px solid rgba(0,0,0,0.2);border-radius:6px}
.top-bar input[type="number"]{width:80px;font-family:monospace;font-size:13px;padding:6px 8px;border:0.5px solid rgba(0,0,0,0.2);border-radius:6px}
.top-bar label{font-size:11px;color:#666;white-space:nowrap}
.top-bar input:focus{outline:none;border-color:rgba(0,0,0,0.4)}

.editor{display:grid;grid-template-columns:1fr 260px;gap:12px;margin-bottom:12px}
@media(max-width:768px){.editor{grid-template-columns:1fr}}

/* canvas panel */
.canvas-panel{background:#fff;border:0.5px solid rgba(0,0,0,0.12);border-radius:10px;padding:10px;display:flex;flex-direction:column}
.toolbar{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.draw-area{text-align:center;flex:1;position:relative}
.draw-wrap{position:relative;line-height:0;overflow:hidden;display:inline-block;max-width:100%;border:0.5px solid rgba(0,0,0,0.1)}
.draw-wrap img{max-width:100%;display:block}
.draw-wrap canvas{position:absolute;top:0;left:0;cursor:crosshair}
.hint{font-size:11px;color:#666;padding:4px 8px;background:#f5f4f0;border-radius:6px;margin-bottom:6px}

/* shapes panel */
.shapes-panel{background:#fff;border:0.5px solid rgba(0,0,0,0.12);border-radius:10px;padding:10px;overflow-y:auto;max-height:600px;display:flex;flex-direction:column}
.shapes-title{font-size:11px;font-weight:500;color:#666;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.shape-list{display:flex;flex-direction:column;gap:6px;flex:1;overflow-y:auto}
.shape-item{background:#f5f4f0;border-radius:8px;padding:8px 10px;cursor:pointer;border:2px solid transparent;transition:border-color 0.15s}
.shape-item.selected{border-color:#378ADD;background:#f0f5fc}
.shape-item.overlap{border-color:#dd2222;background:#fdf0f0}
.shape-item.overlap.selected{border-color:#dd2222;background:#fce4e4}
.shape-item-hdr{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.shape-item-num{font-size:11px;font-weight:600;color:#fff;background:#999;border-radius:4px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.shape-item.selected .shape-item-num{background:#378ADD}
.shape-item-type{font-size:12px;font-weight:500;color:#1a1a18;flex:1}
.shape-item-del{font-size:13px;color:#a32d2d;background:none;border:none;cursor:pointer;padding:0 2px;line-height:1;opacity:0.5}
.shape-item-del:hover{opacity:1}
.shape-item input[type="text"]{width:100%;font-size:12px;padding:4px 6px;border:0.5px solid rgba(0,0,0,0.15);border-radius:5px;background:#fff;font-family:system-ui,sans-serif}
.shape-item input[type="text"]:focus{outline:none;border-color:rgba(0,0,0,0.3)}
.shape-item .smooth-row{display:flex;align-items:center;gap:6px;margin-top:4px}
.shape-item .smooth-row label{font-size:10px;color:#666;white-space:nowrap}
.shape-item .smooth-row input[type="range"]{flex:1;accent-color:#378ADD}
.shape-item .smooth-row span{font-size:10px;color:#666;min-width:12px;text-align:right;font-family:monospace}
.shape-item .pct-line{font-size:10px;color:#999;font-family:monospace;margin-top:3px}
.no-shapes{font-size:12px;color:#999;text-align:center;padding:20px 0}

/* bottom bar */
.bottom-bar{background:#fff;border:0.5px solid rgba(0,0,0,0.12);border-radius:10px;padding:10px 14px}
.btn{padding:7px 14px;font-size:13px;cursor:pointer;border-radius:8px;border:0.5px solid rgba(0,0,0,0.2);background:#f5f4f0;color:#1a1a18}
.btn:hover{background:#e8e7e3}
.btn-primary{background:#378ADD;color:#fff;border-color:transparent;font-weight:500}
.btn-primary:hover{background:#2d78c5}
.btn-primary:disabled{background:#aaa;cursor:not-allowed;border-color:transparent}
.btn-primary:disabled:hover{background:#aaa}
/* modal popout */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.35);z-index:100;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:12px;padding:16px 20px;max-width:700px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,0.2)}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.modal-hdr h2{font-size:14px;font-weight:600;color:#1a1a18;margin:0}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:#999;padding:0 4px;line-height:1}
.modal-close:hover{color:#1a1a18}
.action-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.btn-sm{padding:4px 8px;font-size:11px;cursor:pointer;border-radius:6px;border:0.5px solid rgba(0,0,0,0.2);background:#f5f4f0;color:#1a1a18}
.btn-sm:hover{background:#e8e7e3}
.btn-sm.active{background:#e8f0fa;color:#185fa5;border-color:transparent}
.copied{background:#3b6d11 !important;color:#fff !important;border-color:transparent !important}
details summary{font-size:12px;color:#666;cursor:pointer;padding:6px 0}
details[open] summary{margin-bottom:8px}
.codegen-pre{font-size:11px;font-family:monospace;color:#666;white-space:pre;overflow-x:auto;line-height:1.5;max-height:250px;overflow-y:auto;background:#f5f4f0;padding:8px;border-radius:6px}
/* style groups */
.style-groups{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.style-group{flex:1;min-width:140px;background:#f5f4f0;border-radius:8px;padding:8px 10px}
.style-group-title{font-size:10px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.style-group-title input[type="checkbox"]{accent-color:#378ADD}
.style-group .sg-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.style-group .sg-row:last-child{margin-bottom:0}
.style-group .sg-row label{font-size:10px;color:#666;min-width:50px}
.style-group .sg-row input[type="color"]{width:32px;height:20px;border:0.5px solid rgba(0,0,0,0.15);border-radius:4px;padding:1px;cursor:pointer;background:#fff;flex-shrink:0}
.style-group .sg-row input[type="range"]{flex:1;accent-color:#378ADD}
.style-group .sg-row .range-val{font-size:10px;font-family:monospace;color:#666;min-width:16px;text-align:right}
.status{font-size:12px;color:#666;margin-left:8px}
.status.err{color:#a32d2d}
.placeholder{display:flex;align-items:center;justify-content:center;min-height:200px;color:#999;font-size:13px;background:#f5f4f0;border-radius:6px}
</style>
</head>
<body>
<h1>Twine Hotspot Tool</h1>

<!-- TOP BAR -->
<div class="top-bar">
  <input id="drawUrl" type="text" placeholder="Paste image URL..." value="https://media.istockphoto.com/id/1393415463/vector/magic-wizard-witch-room-staff-workplace-concept-vector-flat-graphic-design-illustration.jpg?s=612x612&amp;w=0&amp;k=20&amp;c=Y7fBC9m5C5j3Y8aFoWQM_pQyzROfSLlT2plDs6_Ey8M="/>
  <button class="btn" onclick="loadDrawImg()">Load</button>
  <label>Display width:</label>
  <input type="number" id="dispW" value="600" oninput="onDimChange()"/>
  <span id="drawStatus" class="status"></span>
</div>

<!-- EDITOR -->
<div class="editor">
  <!-- Canvas -->
  <div class="canvas-panel">
    <div class="toolbar" id="toolbar" style="display:none">
      <button id="tool-select" class="btn-sm" onclick="setTool('select')">Select</button>
      <button id="tool-rect"   class="btn-sm active" onclick="setTool('rect')">Rect</button>
      <button id="tool-circle" class="btn-sm" onclick="setTool('circle')">Circle</button>
      <button id="tool-poly"   class="btn-sm" onclick="setTool('poly')">Polygon</button>
      <span style="flex:1"></span>
      <button class="btn-sm" onclick="undoLast()">Undo</button>
      <button class="btn-sm" onclick="clearAll()">Clear</button>
    </div>
    <div id="polyHint" class="hint" style="display:none">Click to add points -- double-click to close.</div>
    <div class="draw-area">
      <div id="placeholderMsg" class="placeholder">Load an image to start drawing</div>
      <div class="draw-wrap" id="drawWrap" style="display:none">
        <img id="drawImg" style="max-width:100%;display:block;user-select:none;pointer-events:none"/>
        <canvas id="drawCanvas"></canvas>
      </div>
    </div>
  </div>

  <!-- Shapes list -->
  <div class="shapes-panel">
    <div class="shapes-title">Hotspots</div>
    <div id="shapeList" class="shape-list">
      <div class="no-shapes">No hotspots yet</div>
    </div>
  </div>
</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <details id="optsDetails" open>
    <summary>Style options</summary>
    <div class="style-groups">
      <div class="style-group">
        <div class="style-group-title">Mask</div>
        <div class="sg-row">
          <label>Color</label>
          <input type="color" id="maskColor" value="#ffc2c2" oninput="liveUpdate()"/>
          <input type="range" id="maskOpacity" min="0" max="100" value="30" oninput="this.nextElementSibling.textContent=this.value;liveUpdate()"/>
          <span class="range-val">30</span>
        </div>
      </div>
      <div class="style-group">
        <div class="style-group-title">Outline</div>
        <div class="sg-row">
          <label>Color</label>
          <input type="color" id="outlineColor" value="#ffae00" oninput="liveUpdate()"/>
          <input type="range" id="outlineWeight" min="0" max="12" value="8" oninput="this.nextElementSibling.textContent=this.value;liveUpdate()"/>
          <span class="range-val">8</span>
        </div>
      </div>
      <div class="style-group">
        <div class="style-group-title">
          <input type="checkbox" id="hoverEnabled" checked oninput="liveUpdate()"/> Hover glow
        </div>
        <div class="sg-row">
          <label>Color</label>
          <input type="color" id="hoverColor" value="#ffff00" oninput="liveUpdate()"/>
          <input type="range" id="hoverIntensity" min="0" max="40" value="15" oninput="this.nextElementSibling.textContent=this.value;liveUpdate()"/>
          <span class="range-val">15</span>
        </div>
      </div>
      <div class="style-group">
        <div class="style-group-title">
          <input type="checkbox" id="labelsEnabled" checked oninput="liveUpdate()"/> Hover labels
        </div>
      </div>
    </div>
  </details>
  <div class="action-bar">
    <button class="btn btn-primary" id="copyBtn" onclick="copyCode()">Copy Twine Code</button>
    <button class="btn" id="storyJsBtn" onclick="copyStoryJs()">Copy Story JS Setup</button>
    <button class="btn" onclick="showModal('pctModal')">Relative Mask Paths</button>
    <button class="btn" onclick="showModal('codeModal')">Generated Twine Code</button>
    <div id="overlapWarning" style="display:none;font-size:11px;color:#dd2222;padding:4px 8px;background:#fdf0f0;border-radius:6px">Overlapping hotspots — fix before copying</div>
  </div>
  <div style="margin-top:8px;font-size:10px;color:#999;display:flex;gap:12px;flex-wrap:wrap">
    <span>Image mapping inspired by <a href="https://www.maschek.hu/imagemap/" target="_blank" style="color:#999">Online Image Map Editor</a> by maschek.hu</span>
  </div>
  <!-- hidden containers for modal content -->
  <div id="pctOutput" style="display:none"></div>
  <div id="codeOutput" style="display:none"></div>
</div>

<script>
var natW=0,natH=0,generatedCode='';
var tool='rect',isDown=false,sx=0,sy=0,mx=0,my=0;
var shapes=[],polyPts=[],selectedIdx=-1,overlaps=[];
var dragOffset=null,hoveredIdx=-1;
var canvas=document.getElementById('drawCanvas');
var ctx=canvas.getContext('2d');
var drawImg=document.getElementById('drawImg');
var COLORS=['#ff7800','#0096ff','#00c850','#c800dc','#ffc800','#ff4060','#00c8c8'];

/* ---- Chaikin smoothing + RDP simplification ---- */
function chaikinSmooth(coords,iterations){
  if(iterations<=0)return coords;
  var pts=[];
  for(var i=0;i<coords.length;i+=2)pts.push([coords[i],coords[i+1]]);
  for(var it=0;it<iterations;it++){
    var np=[];
    for(var j=0;j<pts.length;j++){
      var p0=pts[j],p1=pts[(j+1)%pts.length];
      np.push([0.75*p0[0]+0.25*p1[0],0.75*p0[1]+0.25*p1[1]]);
      np.push([0.25*p0[0]+0.75*p1[0],0.25*p0[1]+0.75*p1[1]]);
    }
    pts=np;
  }
  // simplify closed polygon with RDP
  var epsilon=0.5;
  pts=rdpClosed(pts,epsilon);
  var out=[];
  pts.forEach(function(p){out.push(Math.round(p[0]),Math.round(p[1]));});
  return out;
}

function rdpClosed(pts,epsilon){
  if(pts.length<=4)return pts;
  var maxD=0,splitIdx=0;
  for(var i=0;i<pts.length;i++){
    var prev=pts[(i-1+pts.length)%pts.length],next=pts[(i+1)%pts.length];
    var d=perpDist(pts[i],prev,next);
    if(d>maxD){maxD=d;splitIdx=i;}
  }
  var rotated=pts.slice(splitIdx).concat(pts.slice(0,splitIdx));
  rotated.push(rotated[0]);
  var simplified=rdpSimplify(rotated,epsilon);
  simplified.pop();
  return simplified;
}

function rdpSimplify(pts,epsilon){
  if(pts.length<=2)return pts;
  var dmax=0,idx=0;
  var first=pts[0],last=pts[pts.length-1];
  for(var i=1;i<pts.length-1;i++){
    var d=perpDist(pts[i],first,last);
    if(d>dmax){dmax=d;idx=i;}
  }
  if(dmax>epsilon){
    var left=rdpSimplify(pts.slice(0,idx+1),epsilon);
    var right=rdpSimplify(pts.slice(idx),epsilon);
    return left.slice(0,-1).concat(right);
  }
  return[first,last];
}

function perpDist(p,a,b){
  var dx=b[0]-a[0],dy=b[1]-a[1];
  var len=Math.sqrt(dx*dx+dy*dy);
  if(len===0)return Math.sqrt(Math.pow(p[0]-a[0],2)+Math.pow(p[1]-a[1],2));
  return Math.abs(dy*p[0]-dx*p[1]+b[0]*a[1]-b[1]*a[0])/len;
}

/* ---- Overlap detection ---- */
function drawShapeOnCtx(tc,s,sc){
  tc.beginPath();
  if(s.shape==='rect') tc.rect(s.coords[0]*sc,s.coords[1]*sc,(s.coords[2]-s.coords[0])*sc,(s.coords[3]-s.coords[1])*sc);
  else if(s.shape==='circle') tc.arc(s.coords[0]*sc,s.coords[1]*sc,s.coords[2]*sc,0,Math.PI*2);
  else if(s.shape==='poly'){
    var c=s.smooth>0?chaikinSmooth(s.coords,s.smooth):s.coords;
    for(var j=0;j<c.length;j+=2){j===0?tc.moveTo(c[j]*sc,c[j+1]*sc):tc.lineTo(c[j]*sc,c[j+1]*sc);}
    tc.closePath();
  }
}
function shapesOverlap(a,b){
  var sc=200/Math.max(natW,natH);
  var w=Math.ceil(natW*sc),h=Math.ceil(natH*sc);
  var tc=document.createElement('canvas');tc.width=w;tc.height=h;
  var c=tc.getContext('2d');
  c.fillStyle='#f00';drawShapeOnCtx(c,a,sc);c.fill();
  c.globalCompositeOperation='source-in';
  c.fillStyle='#00f';drawShapeOnCtx(c,b,sc);c.fill();
  var data=c.getImageData(0,0,w,h).data;
  for(var i=3;i<data.length;i+=4)if(data[i]>0)return true;
  return false;
}

/* ---- Hit testing for select tool ---- */
function hitTest(nx,ny){
  for(var i=shapes.length-1;i>=0;i--){
    var s=shapes[i];
    if(s.shape==='rect'){
      if(nx>=s.coords[0]&&nx<=s.coords[2]&&ny>=s.coords[1]&&ny<=s.coords[3])return i;
    }else if(s.shape==='circle'){
      var dx=nx-s.coords[0],dy=ny-s.coords[1];
      if(dx*dx+dy*dy<=s.coords[2]*s.coords[2])return i;
    }else if(s.shape==='poly'){
      var c=s.smooth>0?chaikinSmooth(s.coords,s.smooth):s.coords;
      if(pointInPoly(nx,ny,c))return i;
    }
  }
  return -1;
}
function pointInPoly(x,y,coords){
  var inside=false;
  for(var i=0,j=coords.length-2;i<coords.length;j=i,i+=2){
    var xi=coords[i],yi=coords[i+1],xj=coords[j],yj=coords[j+1];
    if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)inside=!inside;
  }
  return inside;
}

/* ---- Shape center for dragging ---- */
function shapeCenter(s){
  if(s.shape==='rect')return{x:(s.coords[0]+s.coords[2])/2,y:(s.coords[1]+s.coords[3])/2};
  if(s.shape==='circle')return{x:s.coords[0],y:s.coords[1]};
  var xs=s.coords.filter(function(_,i){return i%2===0;}),ys=s.coords.filter(function(_,i){return i%2===1;});
  return{x:xs.reduce(function(a,b){return a+b;},0)/xs.length,y:ys.reduce(function(a,b){return a+b;},0)/ys.length};
}
function moveShape(s,dx,dy){
  if(s.shape==='rect'){s.coords=[s.coords[0]+dx,s.coords[1]+dy,s.coords[2]+dx,s.coords[3]+dy];}
  else if(s.shape==='circle'){s.coords=[s.coords[0]+dx,s.coords[1]+dy,s.coords[2]];}
  else if(s.shape==='poly'){s.coords=s.coords.map(function(v,i){return Math.round(v+(i%2===0?dx:dy));});}
}

/* ---- Image loading ---- */
function loadDrawImg(){
  var url=document.getElementById('drawUrl').value.trim();
  if(!url)return;
  var st=document.getElementById('drawStatus');
  st.textContent='Loading...';st.className='status';
  drawImg.onload=function(){
    st.textContent='';
    document.getElementById('toolbar').style.display='flex';
    document.getElementById('placeholderMsg').style.display='none';
    document.getElementById('drawWrap').style.display='inline-block';
    natW=drawImg.naturalWidth;natH=drawImg.naturalHeight;
    syncCanvas();
    onDimChange();
  };
  drawImg.onerror=function(){st.textContent='Failed to load';st.className='status err';};
  drawImg.src=url;
}

function syncCanvas(){
  var w=drawImg.offsetWidth,h=drawImg.offsetHeight;
  if(w&&h){canvas.width=w;canvas.height=h;canvas.style.width=w+'px';canvas.style.height=h+'px';}
  redrawCanvas();
}
new ResizeObserver(function(){if(drawImg.offsetWidth)syncCanvas();}).observe(drawImg);

function onDimChange(){recalc();}

/* ---- Tools ---- */
function setTool(t){
  tool=t;polyPts=[];isDown=false;dragOffset=null;
  document.querySelectorAll('.toolbar .btn-sm').forEach(function(b){b.classList.remove('active');});
  var el=document.getElementById('tool-'+t);if(el)el.classList.add('active');
  document.getElementById('polyHint').style.display=(t==='poly')?'block':'none';
  canvas.style.cursor=(t==='select')?'default':'crosshair';
}

function getPos(e){var r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function toNatX(cx){return natW?Math.round(cx*natW/canvas.width):Math.round(cx);}
function toNatY(cy){return natH?Math.round(cy*natH/canvas.height):Math.round(cy);}
function toCvX(nx){return natW?nx*canvas.width/natW:nx;}
function toCvY(ny){return natH?ny*canvas.height/natH:ny;}

canvas.addEventListener('mousedown',function(e){
  var p=getPos(e);
  if(tool==='select'){
    var idx=hitTest(toNatX(p.x),toNatY(p.y));
    selectShape(idx);
    if(idx>=0){
      isDown=true;sx=p.x;sy=p.y;
      dragOffset={sx:toNatX(p.x),sy:toNatY(p.y)};
    }
    return;
  }
  if(tool==='poly')return;
  isDown=true;sx=p.x;sy=p.y;mx=p.x;my=p.y;
});

canvas.addEventListener('mousemove',function(e){
  var p=getPos(e);mx=p.x;my=p.y;
  if(tool==='select'&&isDown&&dragOffset&&selectedIdx>=0){
    var nx=toNatX(p.x),ny=toNatY(p.y);
    var dx=nx-dragOffset.sx,dy=ny-dragOffset.sy;
    if(dx!==0||dy!==0){
      moveShape(shapes[selectedIdx],dx,dy);
      dragOffset.sx=nx;dragOffset.sy=ny;
      redrawCanvas();updateShapeList();recalc();
    }
    return;
  }
  var newHover=hitTest(toNatX(p.x),toNatY(p.y));
  if(newHover!==hoveredIdx){hoveredIdx=newHover;redrawCanvas();}
  if(isDown||(tool==='poly'&&polyPts.length>0))redrawCanvas();
});
canvas.addEventListener('mouseleave',function(){
  hoveredIdx=-1;
  if(tool!=='select')isDown=false;
  redrawCanvas();
});

canvas.addEventListener('mouseup',function(e){
  if(tool==='select'){isDown=false;dragOffset=null;return;}
  if(!isDown||tool==='poly')return;
  var p=getPos(e);isDown=false;
  if(tool==='rect'){
    var x1=toNatX(Math.min(sx,p.x)),y1=toNatY(Math.min(sy,p.y)),x2=toNatX(Math.max(sx,p.x)),y2=toNatY(Math.max(sy,p.y));
    if(Math.abs(x2-x1)>4&&Math.abs(y2-y1)>4)addShape({shape:'rect',coords:[x1,y1,x2,y2],passage:'Passage '+(shapes.length+1),label:'',smooth:0});
  } else if(tool==='circle'){
    var cx=toNatX(sx),cy=toNatY(sy),r=Math.round(Math.sqrt(Math.pow(p.x-sx,2)+Math.pow(p.y-sy,2))*natW/canvas.width);
    if(r>4)addShape({shape:'circle',coords:[cx,cy,r],passage:'Passage '+(shapes.length+1),label:'',smooth:0});
  }
  redrawCanvas();
});

canvas.addEventListener('click',function(e){if(tool!=='poly')return;var p=getPos(e);polyPts.push([p.x,p.y]);redrawCanvas();});
canvas.addEventListener('dblclick',function(e){
  if(tool!=='poly')return;
  polyPts.pop();
  if(polyPts.length>=3){
    var coords=[];polyPts.forEach(function(p){coords.push(toNatX(p[0]),toNatY(p[1]));});
    addShape({shape:'poly',coords:coords,passage:'Passage '+(shapes.length+1),label:'',smooth:0});
  }
  polyPts=[];redrawCanvas();
});

/* ---- Shape management ---- */
function addShape(s){shapes.push(s);selectShape(shapes.length-1);updateShapeList();recalc();}
function selectShape(i){selectedIdx=i;updateShapeList();redrawCanvas();}

function deleteShape(i,ev){
  if(ev)ev.stopPropagation();
  shapes.splice(i,1);
  if(selectedIdx===i)selectedIdx=-1;
  else if(selectedIdx>i)selectedIdx--;
  updateShapeList();redrawCanvas();recalc();
}

function updatePassage(i,val){shapes[i].passage=val;recalc(true);}
function updateLabel(i,val){shapes[i].label=val;recalc(true);}
function updateSmooth(i,val){shapes[i].smooth=parseInt(val)||0;redrawCanvas();recalc(true);}

function updateShapeList(){
  var el=document.getElementById('shapeList');
  if(!shapes.length){el.innerHTML='<div class="no-shapes">No hotspots yet</div>';return;}
  el.innerHTML=shapes.map(function(s,i){
    var hasOverlap=overlaps[i];
    var sel=i===selectedIdx?' selected':'';
    if(hasOverlap)sel+=' overlap';
    var col=hasOverlap?'#dd2222':COLORS[i%COLORS.length];
    var pctLine='';
    if(natW&&natH){
      var p=calcPct(s);
      pctLine='<div class="pct-line">'+p.left+'%, '+p.top+'% &mdash; '+p.width+'% &times; '+p.height+'%</div>';
    }
    var smoothHtml='';
    if(s.shape==='poly'){
      smoothHtml='<div class="smooth-row"><label>Smooth</label><input type="range" min="0" max="10" value="'+s.smooth+'" oninput="updateSmooth('+i+',this.value);this.nextElementSibling.textContent=this.value" onclick="event.stopPropagation()"/><span>'+s.smooth+'</span></div>';
    }
    return'<div class="shape-item'+sel+'" onclick="selectShape('+i+')">'
      +'<div class="shape-item-hdr"><span class="shape-item-num" style="background:'+col+'">'+(i+1)+'</span>'
      +'<span class="shape-item-type">'+s.shape+'</span>'
      +'<button class="shape-item-del" onclick="deleteShape('+i+',event)">&#10005;</button></div>'
      +'<input type="text" value="'+s.passage.replace(/"/g,'&quot;')+'" placeholder="Passage name" oninput="updatePassage('+i+',this.value)" onclick="event.stopPropagation()"/>'
      +'<input type="text" value="'+(s.label||'').replace(/"/g,'&quot;')+'" placeholder="Hover label (optional)" oninput="updateLabel('+i+',this.value)" onclick="event.stopPropagation()" style="margin-top:3px;font-size:11px;color:#666"/>'
      +smoothHtml+pctLine+'</div>';
  }).join('');
}

function undoLast(){if(polyPts.length){polyPts=[];redrawCanvas();return;}if(shapes.length){shapes.pop();if(selectedIdx>=shapes.length)selectedIdx=shapes.length-1;updateShapeList();redrawCanvas();recalc();}}
function clearAll(){shapes=[];polyPts=[];selectedIdx=-1;isDown=false;updateShapeList();redrawCanvas();recalc();}

/* ---- Canvas drawing ---- */
function hexToRgba(hex,a){var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return'rgba('+r+','+g+','+b+','+a+')';}

function liveUpdate(){redrawCanvas();recalc();}

function redrawCanvas(){
  if(!canvas.width)return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  var maskOp=parseInt(document.getElementById('maskOpacity').value)||0;
  var maskCol=document.getElementById('maskColor').value;
  var hoverOn=document.getElementById('hoverEnabled').checked;
  var hoverInt=hoverOn?(parseInt(document.getElementById('hoverIntensity').value)||0):0;
  var hoverCol=document.getElementById('hoverColor').value;
  var hRgb=hexToRgb(hoverCol);
  var outCol=document.getElementById('outlineColor').value;
  var outW=parseInt(document.getElementById('outlineWeight').value)||0;
  shapes.forEach(function(s,i){
    var hasOverlap=overlaps[i];
    var col=hasOverlap?'#dd2222':COLORS[i%COLORS.length];
    var isSel=i===selectedIdx;
    var isHov=i===hoveredIdx;
    // outline
    if(outW>0){
      ctx.strokeStyle=isSel?hexToRgba(col,1):outCol;
      ctx.lineWidth=isSel?outW+1:outW;
    }else{
      ctx.strokeStyle='transparent';
      ctx.lineWidth=0;
    }
    // mask fill
    if(hasOverlap){
      ctx.fillStyle=hexToRgba(col,isSel?0.3:0.2);
    }else{
      ctx.fillStyle=hexToRgba(maskCol,maskOp/100);
    }
    // hover glow
    if(isHov&&hoverInt>0){
      ctx.shadowColor='rgba('+hRgb.r+','+hRgb.g+','+hRgb.b+',0.8)';
      ctx.shadowBlur=hoverInt;
    }else{
      ctx.shadowColor='transparent';ctx.shadowBlur=0;
    }
    if(s.shape==='rect'){
      var x1=toCvX(s.coords[0]),y1=toCvY(s.coords[1]),w=toCvX(s.coords[2])-x1,h=toCvY(s.coords[3])-y1;
      ctx.fillRect(x1,y1,w,h);ctx.strokeRect(x1,y1,w,h);
    }else if(s.shape==='circle'){
      var cx=toCvX(s.coords[0]),cy=toCvY(s.coords[1]),r=s.coords[2]*canvas.width/(natW||canvas.width);
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();ctx.stroke();
    }else if(s.shape==='poly'){
      var c=s.smooth>0?chaikinSmooth(s.coords,s.smooth):s.coords;
      ctx.lineJoin='round';ctx.lineCap='round';
      ctx.beginPath();
      for(var j=0;j<c.length;j+=2){j===0?ctx.moveTo(toCvX(c[j]),toCvY(c[j+1])):ctx.lineTo(toCvX(c[j]),toCvY(c[j+1]));}
      ctx.closePath();ctx.fill();ctx.stroke();
      ctx.lineJoin='miter';ctx.lineCap='butt';
    }
    ctx.shadowColor='transparent';ctx.shadowBlur=0;
    ctx.fillStyle=hexToRgba(col,0.95);ctx.font=(isSel?'bold ':'')+' 12px sans-serif';
    ctx.fillText(i+1,toCvX(s.coords[0])+4,toCvY(s.coords[1])+14);
    // show label tooltip on hover
    var labelsOn=document.getElementById('labelsEnabled').checked;
    if(isHov&&s.label&&labelsOn){
      var ctr=shapeCenter(s);
      var tx=toCvX(ctr.x),ty=toCvY(ctr.y)-12;
      ctx.font='bold 13px sans-serif';
      var tw=ctx.measureText(s.label).width;
      ctx.fillStyle='rgba(0,0,0,0.75)';
      ctx.beginPath();
      var bx=tx-tw/2-6,by=ty-14,bw=tw+12,bh=20,br=5;
      ctx.moveTo(bx+br,by);ctx.lineTo(bx+bw-br,by);ctx.quadraticCurveTo(bx+bw,by,bx+bw,by+br);
      ctx.lineTo(bx+bw,by+bh-br);ctx.quadraticCurveTo(bx+bw,by+bh,bx+bw-br,by+bh);
      ctx.lineTo(bx+br,by+bh);ctx.quadraticCurveTo(bx,by+bh,bx,by+bh-br);
      ctx.lineTo(bx,by+br);ctx.quadraticCurveTo(bx,by,bx+br,by);
      ctx.fill();
      ctx.fillStyle='#fff';ctx.textAlign='center';
      ctx.fillText(s.label,tx,ty);
      ctx.textAlign='start';
    }
  });
  // drawing preview
  if(isDown&&tool!=='select'){
    ctx.strokeStyle='rgba(255,60,60,0.9)';ctx.lineWidth=2;ctx.fillStyle='rgba(255,60,60,0.1)';
    if(tool==='rect'){ctx.fillRect(sx,sy,mx-sx,my-sy);ctx.strokeRect(sx,sy,mx-sx,my-sy);}
    else if(tool==='circle'){var rr=Math.sqrt(Math.pow(mx-sx,2)+Math.pow(my-sy,2));ctx.beginPath();ctx.arc(sx,sy,rr,0,Math.PI*2);ctx.fill();ctx.stroke();}
  }
  if(tool==='poly'&&polyPts.length){
    ctx.strokeStyle='rgba(255,60,60,0.9)';ctx.lineWidth=2;
    ctx.beginPath();polyPts.forEach(function(p,i){i===0?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]);});ctx.lineTo(mx,my);ctx.stroke();
    polyPts.forEach(function(p){ctx.beginPath();ctx.arc(p[0],p[1],3,0,Math.PI*2);ctx.fillStyle='rgba(255,60,60,0.9)';ctx.fill();});
  }
}

/* ---- Percentage calculation ---- */
function pc(v,t){return Math.round(v/t*10000)/100;}
function calcPct(s){
  var left,top,width,height,clipPath='',isCircle=false;
  if(s.shape==='rect'){
    left=pc(s.coords[0],natW);top=pc(s.coords[1],natH);width=pc(s.coords[2]-s.coords[0],natW);height=pc(s.coords[3]-s.coords[1],natH);
  }else if(s.shape==='circle'){
    var cx=s.coords[0],cy=s.coords[1],r=s.coords[2];
    left=pc(cx-r,natW);top=pc(cy-r,natH);width=pc(r*2,natW);height=pc(r*2,natH);isCircle=true;
  }else if(s.shape==='poly'){
    var c=s.smooth>0?chaikinSmooth(s.coords,s.smooth):s.coords;
    var xs=c.filter(function(_,i){return i%2===0;}),ys=c.filter(function(_,i){return i%2===1;});
    var px1=Math.min.apply(null,xs),py1=Math.min.apply(null,ys),px2=Math.max.apply(null,xs),py2=Math.max.apply(null,ys);
    var bw=px2-px1,bh=py2-py1;
    left=pc(px1,natW);top=pc(py1,natH);width=pc(bw,natW);height=pc(bh,natH);
    var pts=xs.map(function(_,k){return Math.round((xs[k]-px1)/bw*10000)/100+'% '+Math.round((ys[k]-py1)/bh*10000)/100+'%';}).join(', ');
    clipPath='clip-path: polygon('+pts+');';
  }
  return{left:left,top:top,width:width,height:height,clipPath:clipPath,isCircle:isCircle};
}

/* ---- Recalculate everything ---- */
function recalc(skipList){
  if(!natW||!natH||!shapes.length){
    document.getElementById('codeOutput').textContent='';
    document.getElementById('pctOutput').innerHTML='';
    generatedCode='';overlaps=[];
    return;
  }
  // compute overlaps
  overlaps=new Array(shapes.length);
  for(var i=0;i<shapes.length;i++)overlaps[i]=false;
  for(var a=0;a<shapes.length;a++){
    for(var b=a+1;b<shapes.length;b++){
      if(shapesOverlap(shapes[a],shapes[b])){overlaps[a]=true;overlaps[b]=true;}
    }
  }
  var hasAnyOverlap=overlaps.some(function(v){return v;});
  document.getElementById('copyBtn').disabled=hasAnyOverlap;
  document.getElementById('overlapWarning').style.display=hasAnyOverlap?'block':'none';
  // generate code
  var imgUrl=document.getElementById('drawUrl').value.trim()||'YOUR-IMAGE-URL-HERE';
  var hoverOn=document.getElementById('hoverEnabled').checked;
  var hoverInt=hoverOn?(parseInt(document.getElementById('hoverIntensity').value)||0):0;
  var hoverCol=document.getElementById('hoverColor').value;
  var maskOp=parseInt(document.getElementById('maskOpacity').value)||0;
  var maskCol=document.getElementById('maskColor').value;
  var labelsOn=document.getElementById('labelsEnabled').checked;
  var hRgb=hexToRgb(hoverCol),mRgb=hexToRgb(maskCol);
  var maskBg=maskOp>0?'rgba('+mRgb.r+','+mRgb.g+','+mRgb.b+','+(maskOp/100).toFixed(2)+')':'rgba(0,0,0,0)';
  var hoverFilter=hoverInt>0?'drop-shadow(0 0 '+hoverInt+'px rgba('+hRgb.r+','+hRgb.g+','+hRgb.b+',0.8))':'none';
  var outCol=document.getElementById('outlineColor').value;
  var outW=parseInt(document.getElementById('outlineWeight').value)||0;
  var oRgb=hexToRgb(outCol);
  var dispW=parseInt(document.getElementById('dispW').value)||600;

  var lines=shapes.map(function(s){
    var p=calcPct(s);
    var line='    { left:"'+p.left+'%", top:"'+p.top+'%", width:"'+p.width+'%", height:"'+p.height+'%",';
    line+=(p.isCircle?' circle:true,':" circle:false,");
    if(p.clipPath){
      line+=' clipPath:"'+p.clipPath+'",';
      // SVG points for polygon outline (percentage coords relative to bounding box)
      var c=s.smooth>0?chaikinSmooth(s.coords,s.smooth):s.coords;
      var xs=c.filter(function(_,j){return j%2===0;}),ys=c.filter(function(_,j){return j%2===1;});
      var px1=Math.min.apply(null,xs),py1=Math.min.apply(null,ys),bw=Math.max.apply(null,xs)-px1,bh=Math.max.apply(null,ys)-py1;
      var svgPts=xs.map(function(_,k){return((xs[k]-px1)/bw*100).toFixed(1)+','+((ys[k]-py1)/bh*100).toFixed(1);}).join(' ');
      line+=' svgPts:"'+svgPts+'",';
    }
    if(labelsOn)line+=' label:"'+(s.label||'').replace(/"/g,'\\"')+'",';
    line+=' passage:"'+s.passage+'" }';
    return line;
  }).join(',\n');

  var outlineBorder=outW>0?'border: '+outW+'px solid rgba('+oRgb.r+','+oRgb.g+','+oRgb.b+',1); box-sizing: border-box;':'';

  var code='<div id="hotspot-container"\n     style="position:relative; max-width:'+dispW+'px; overflow:hidden; padding:0; margin:0; line-height:0; font-size:0;">\n  <img src="'+imgUrl+'"\n       alt="description of your image"\n       style="width:100%; display:block; padding:0; margin:0;">\n</div>\n\n<script>\n(function() {\n  var container = document.getElementById("hotspot-container");\n  var hotspots = [\n'+lines+'\n  ];\n  hotspots.forEach(function(h) {\n';
  // For clip-path shapes, use a wrapper div so tooltip + drop-shadow aren't clipped
  code+='    var wrap = document.createElement("div");\n    wrap.style.cssText = "position:absolute;left:"+h.left+";top:"+h.top+";width:"+h.width+";height:"+h.height+";cursor:pointer;overflow:visible;";\n';
  code+='    var glow = document.createElement("div");\n    glow.style.cssText = "width:100%;height:100%;transition:filter 0.2s ease;";\n';
  code+='    var div = document.createElement("div");\n    div.style.cssText = "width:100%;height:100%;background:'+maskBg+';";\n';
  code+='    if (h.circle) { div.style.borderRadius = "50%"; glow.style.borderRadius = "50%";';
  if(outW>0)code+=' div.style.cssText += "'+outlineBorder+'";';
  code+=' }\n    if (h.clipPath) div.style.cssText += h.clipPath;\n';
  if(outW>0)code+='    if (!h.circle && !h.clipPath) div.style.cssText += "'+outlineBorder+'";\n';
  // SVG outline for clip-path polygon shapes
  if(outW>0){
    code+='    if (h.svgPts) {\n      var svg = document.createElementNS("http://www.w3.org/2000/svg","svg");\n      svg.setAttribute("viewBox","0 0 100 100");\n      svg.setAttribute("preserveAspectRatio","none");\n      svg.style.cssText = "position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;";\n      var poly = document.createElementNS("http://www.w3.org/2000/svg","polygon");\n      poly.setAttribute("points",h.svgPts);\n      poly.setAttribute("fill","none");\n      poly.setAttribute("stroke","rgba('+oRgb.r+','+oRgb.g+','+oRgb.b+',1)");\n      poly.setAttribute("stroke-width","'+outW+'");\n      poly.setAttribute("stroke-linejoin","round");\n      poly.setAttribute("vector-effect","non-scaling-stroke");\n      svg.appendChild(poly);\n      wrap.appendChild(svg);\n    }\n';
  }
  // label tooltip on wrapper (never clipped)
  if(labelsOn){
    code+='    if (h.label) {\n      var tip = document.createElement("span");\n      tip.textContent = h.label;\n      tip.style.cssText = "position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;font-size:13px;line-height:1.3;padding:4px 10px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity 0.15s;z-index:10;";\n      wrap.appendChild(tip);\n';
    code+='      wrap.addEventListener("mouseenter", function() { tip.style.opacity = "1";';
    if(hoverInt>0) code+=' glow.style.filter = "'+hoverFilter+'";';
    code+=' });\n      wrap.addEventListener("mouseleave", function() { tip.style.opacity = "0"; glow.style.filter = "none";';
    code+=' });\n    }';
    if(hoverInt>0){
      code+=' else {\n      wrap.addEventListener("mouseenter", function() { glow.style.filter = "'+hoverFilter+'"; });\n      wrap.addEventListener("mouseleave", function() { glow.style.filter = "none"; });\n    }\n';
    } else code+='\n';
  } else {
    if(hoverInt>0)code+='    wrap.addEventListener("mouseenter", function() { glow.style.filter = "'+hoverFilter+'"; });\n    wrap.addEventListener("mouseleave", function() { glow.style.filter = "none"; });\n';
  }
  code+='    wrap.addEventListener("click", function() { window.harlowe.Engine.goToPassage(h.passage); });\n    glow.appendChild(div);\n    wrap.appendChild(glow);\n    container.appendChild(wrap);\n  });\n})();\n<\/script>';

  generatedCode=code;
  document.getElementById('codeOutput').textContent=code;

  // percentage breakdown
  var pctHtml=shapes.map(function(s,i){
    var p=calcPct(s);
    return'<div style="font-size:11px;font-family:monospace;color:#666;padding:4px 0;border-bottom:0.5px solid rgba(0,0,0,0.06)">'
      +'<strong style="color:#1a1a18">'+(i+1)+'. '+s.shape+'</strong> &rarr; '+s.passage
      +'<br>left:'+p.left+'% top:'+p.top+'% width:'+p.width+'% height:'+p.height+'%'
      +(p.clipPath?'<br><span style="color:#999">'+p.clipPath+'</span>':'')
      +'</div>';
  }).join('');
  document.getElementById('pctOutput').innerHTML=pctHtml;

  if(!skipList)updateShapeList();
}

function hexToRgb(hex){return{r:parseInt(hex.slice(1,3),16),g:parseInt(hex.slice(3,5),16),b:parseInt(hex.slice(5,7),16)};}

function showModal(id){
  var title=id==='pctModal'?'Relative Mask Paths (Percent)':'Generated Twine Code';
  var content=id==='pctModal'?document.getElementById('pctOutput').innerHTML:
    '<pre class="codegen-pre">'+escHtml(generatedCode)+'</pre>';
  var overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.onclick=function(e){if(e.target===overlay)overlay.remove();};
  overlay.innerHTML='<div class="modal"><div class="modal-hdr"><h2>'+title+'</h2><button class="modal-close" onclick="this.closest(\'.modal-overlay\').remove()">&times;</button></div>'+content+'</div>';
  document.body.appendChild(overlay);
}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}


function copyCode(){
  if(!generatedCode||overlaps.some(function(v){return v;}))return;
  navigator.clipboard.writeText(generatedCode).then(function(){
    var btn=document.getElementById('copyBtn');
    btn.textContent='Copied!';btn.classList.add('copied');
    setTimeout(function(){btn.textContent='Copy Twine Code';btn.classList.remove('copied');},1500);
  }).catch(function(){
    var ta=document.createElement('textarea');ta.value=generatedCode;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
  });
}

function cp(t){navigator.clipboard.writeText(t).catch(function(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);});}

var STORY_JS='window.harlowe = window.harlowe || {};\nwindow.harlowe.Engine = Engine;';
function copyStoryJs(){
  navigator.clipboard.writeText(STORY_JS).then(function(){
    var btn=document.getElementById('storyJsBtn');
    btn.textContent='Copied!';btn.classList.add('copied');
    setTimeout(function(){btn.textContent='Copy Story JS Setup';btn.classList.remove('copied');},1500);
  }).catch(function(){
    var ta=document.createElement('textarea');ta.value=STORY_JS;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
  });
}
